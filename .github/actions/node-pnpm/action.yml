# Shared setup for jobs that run the TypeScript toolchain: pins pnpm and Node,
# asserts the pins actually landed, and installs from the lockfile. Exists so
# #117, #118 and #119 each add one `uses: ./.github/actions/node-pnpm` line
# instead of copying these steps and the SHA pins into every workflow job. The
# Node pin assertions used to be their own `install` job in ci.yml; #119 moved
# them here so every job using this action gets them, not just one that
# nothing else depended on.
name: Set up pnpm and Node
description: Install pnpm and Node at the pinned versions, assert the pins, then install dependencies from the frozen lockfile.

runs:
  using: composite
  steps:
    # No version input here on purpose: the pin lives in package.json
    # packageManager, one source of truth. The action refuses to run if this
    # input and packageManager disagree.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # node-version-file resolves engines.node from package.json, so the
    # runner gets the newest 22.x that satisfies the floor.
    - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
      with:
        node-version-file: package.json
        cache: pnpm

    - name: Assert the Node pins
      shell: bash
      run: |
        node_version="$(node --version)"
        if [[ ! "$node_version" =~ ^v22\.([0-9]+)\. ]]; then
          echo "expected node --version to match ^v22.(minor)., got $node_version" >&2
          exit 1
        fi
        if (( BASH_REMATCH[1] < 18 )); then
          echo "expected node minor >= 18, got $node_version" >&2
          exit 1
        fi
        # Must match .npmrc's use-node-version exactly; bump both together.
        pnpm_node_version="$(pnpm exec node --version)"
        if [[ "$pnpm_node_version" != "v22.23.2" ]]; then
          echo "expected pnpm exec node --version to print v22.23.2 exactly, got $pnpm_node_version" >&2
          exit 1
        fi

    # Never a bare install: frozen-lockfile fails if package.json and the
    # lockfile disagree, which is what makes the pins real.
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
