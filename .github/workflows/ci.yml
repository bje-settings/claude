name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# THESE CHECK NAMES ARE A CONTRACT: vitest, vitest-floor, types, biome, and
# eslint here, plus plugin-validate in plugin-validate.yml, are required by
# the repo ruleset Require CI (22359720), which matches them by exact string.
# If you rename one, the build does not fail. The required check simply never
# reports again, and every pull request waits forever for something that
# will not arrive. Keep them short and stable. Put descriptive text in step
# names instead, where it helps in logs but does not become load-bearing.
# Each name is a matrix leg. The line `name: ${{ matrix.check }}` sets it.
# A renamed `check` value is a renamed required check.
#
# A new leg name becomes a required check only after it has reported on
# main, for the same reason. Add it to the ruleset right after the pull
# request that introduces it merges.
#
# vitest, vitest-floor, types, and biome, the four TypeScript jobs, joined
# the ruleset at #122 on 2026-09-13. This happened after each had reported
# green on main at least once (ADR 002).
jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    # Job permissions cannot vary by leg. Only the vitest leg needs
    # code-quality: write, for the coverage upload.
    permissions:
      contents: read
      code-quality: write
    # pnpm reads this variable to choose the Node for every pnpm command in
    # the job, including install, and for the child processes. An empty value
    # falls back to the use-node-version in `.npmrc`. Only vitest-floor sets a
    # node value.
    env:
      npm_config_use_node_version: ${{ matrix.node }}
    strategy:
      # Without this, one failure cancels the other legs. Their required
      # checks would then show as cancelled.
      fail-fast: false
      matrix:
        include:
          # The enterprise Code Coverage ruleset takes its input from this
          # leg. The 100 thresholds in vitest.config.ts gate the run.
          - check: vitest
            run: pnpm test
          # ADR 001: "a floor nothing executes is a claim." This proves the
          # suite runs on Node 22.18.0. That is the first release whose type
          # stripping runs without a flag and writes nothing to stderr. It
          # writes no coverage report. The vitest leg is the coverage gate
          # and the enterprise upload. Keep node equal to the floor in
          # `engines.node` in package.json.
          - check: vitest-floor
            node: 22.18.0
            run: pnpm exec vitest run --coverage.enabled=false
          # `noEmit` lives in `tsconfig.json` rather than in this command. The
          # same invocation then means the same thing from an editor or a
          # hook.
          - check: types
            run: pnpm exec tsc -p tsconfig.json
          # `biome ci` is the read-only verdict, never `check --write`. A gate
          # that edits the tree to pass reports on a tree nobody reviewed.
          # --error-on-warnings stops a recommended rule that only warns from
          # passing.
          - check: biome
            run: pnpm exec biome ci . --error-on-warnings
          # ESLint checks the Claude Code configuration files with the
          # eslint-plugin-claude npm package. No `--cache`: some rules read a
          # second file, and the cache does not see a change to that file.
          # `pnpm lint` passes `--max-warnings 0`, so a warning fails the leg,
          # the same as the biome leg.
          - check: eslint
            run: pnpm lint .
    steps:
      - uses: actions/checkout@v7

      # No version input here on purpose: the pin lives in package.json
      # packageManager, one source of truth. The action refuses to run if this
      # input and packageManager disagree.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # node-version-file resolves engines.node from package.json, so the
      # runner gets the newest 22.x that satisfies the floor.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      # This proves that engines.node in package.json resolved to a Node 22
      # at or above the floor.
      - name: Assert the setup-node version
        run: |
          node_version="$(node --version)"
          if [[ ! "$node_version" =~ ^v22\.([0-9]+)\. ]]; then
            echo "expected node --version to match ^v22.(minor)., got $node_version" >&2
            exit 1
          fi
          if (( BASH_REMATCH[1] < 18 )); then
            echo "expected node minor >= 18, got $node_version" >&2
            exit 1
          fi

      # This fails loudly. Otherwise a leg could run on the wrong Node without
      # a sign. That happens when pnpm stops reading the environment variable.
      # A leg with no node value expects the use-node-version in `.npmrc`.
      - name: Assert the Node that pnpm selects
        run: |
          expected="${{ matrix.node }}"
          if [[ -z "$expected" ]]; then
            expected="$(sed -n 's/^use-node-version=//p' .npmrc)"
          fi
          # tail -n 1: on the first run, pnpm prints a "Fetching Node.js ..."
          # line to stdout. That line comes before the `node --version`
          # output. Keep only the last line.
          version="$(pnpm exec node --version | tail -n 1)"
          if [[ "$version" != "v$expected" ]]; then
            echo "expected pnpm exec node --version to print v$expected exactly, got $version" >&2
            exit 1
          fi

      # The assertion above cannot see a floor leg that lost its node value,
      # because it then expects the `.npmrc` pin. This step catches that.
      - name: Refuse a floor leg with no Node pin
        if: matrix.check == 'vitest-floor'
        run: test -n "${{ matrix.node }}"

      # Never a bare install: frozen-lockfile fails if package.json and the
      # lockfile disagree, which is what makes the pins real.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A config lefthook rejects is a hook that silently never runs.
      # Nothing else in CI would catch a malformed lefthook.yml before it
      # reached a contributor's next commit. This leg already has
      # `node_modules`, and the postinstall that would otherwise sync the
      # hooks here is a no-op. Actions sets `CI` for every step, and
      # lefthook's postinstall treats that as a skip.
      - name: Validate lefthook.yml
        if: matrix.check == 'vitest'
        run: pnpm exec lefthook validate

      # `tsc` errors on no inputs. But an include set that shrinks is the
      # quieter failure this repository refuses everywhere. git pathspec
      # `*` matches across directory separators, so `tests/*.ts` reaches
      # nested files too.
      - name: Refuse a run that finds no TypeScript
        if: matrix.check == 'types'
        run: |
          git ls-files -- 'tests/*.ts' 'harness/*.ts' 'lib/*.ts' 'scripts/*.ts' \
            'plugins/*/src/*.ts' 'plugins/*/scripts/*.ts' 'plugins/*/hooks/*.ts' \
            'eslint.config.ts' 'vitest.config.ts' | grep -q .

      - name: Run ${{ matrix.check }}
        run: ${{ matrix.run }}

      # vitest's own thresholds cannot see an empty file set. A 100%
      # threshold over zero files passes (reproduced: it reports
      # "Unknown%" over 0/0 and exits 0). ADR 002 calls this the
      # repository's signature bug, because it arrives inside the coverage
      # gate. The thresholds catch a bucket that drops below 100 over
      # whatever files they did see. This step catches the report that
      # names no files at all.
      - name: Refuse a coverage report that names no file
        if: matrix.check == 'vitest'
        run: jq -e 'del(.total) | length > 0' coverage/coverage-summary.json

      # The enterprise Code Coverage ruleset's input.
      - name: Upload the coverage report
        if: matrix.check == 'vitest'
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
