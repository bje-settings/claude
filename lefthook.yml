# lefthook.yml: local git hooks, staged-only and fast (ADR 002, #120 replaces
# the pre-commit framework with this). `pnpm install` installs them.
# lefthook's own postinstall runs `lefthook install`, through
# `pnpm.onlyBuiltDependencies` in package.json (pnpm 10 blocks a dependency's
# lifecycle scripts otherwise). Or run `pnpm exec lefthook install` by hand.
#
# lefthook resolves the hooks directory with `git rev-parse --git-path hooks`,
# the clone's common dir. So a `pnpm install` from any worktree of this clone
# installs the hook for every worktree of it. Each pnpm-based step below
# still needs its own checkout's `node_modules`.
#
# The installed hook script finds the lefthook binary through a hardcoded
# absolute path. That path points into the checkout that ran the install, or
# into the checkout where the commit runs. As long as the checkout that ran
# the install still has `node_modules`, a worktree can find lefthook through
# it. This works even before that worktree runs its own `pnpm install`, and
# the hooks run there too. Each pnpm-based step still checks for its own
# `node_modules`, though. When a step's `node_modules` is missing, that step
# warns and skips, so the commit goes through unchecked. This also happens
# when no checkout with a working lefthook binary exists at all. Then the
# hook script itself prints `Can't find lefthook in PATH`, and the commit
# goes through the same way.
#
# Either way, the worktree gains real hooks the moment it runs its own
# `pnpm install`.
#
# pre-commit runs only the gates that are staged-scoped and stay fast. Biome
# checks the staged JSON, .mjs, and .ts files. `vitest related` runs the
# tests the staged files reach. `claude plugin validate --strict` runs when a
# plugin or the marketplace manifest is touched.
#
# `tsc -p` is the one step that is NOT staged-only. It type-checks the whole
# project. A type error that a staged file causes is usually in a file that
# was not staged. A project-wide checker, handed a file list, would answer a
# different question. The glob decides when the step runs, not what it
# checks.
#
# None of these runs a suite. ADR 002 states that as a rule, not a budget. A
# hook that runs everything gets slower as the repository grows. Then the
# usual response is to disable it.
#
# There is no `pre-push` key below, so a `lefthook install` against this
# config writes no pre-push hook file. A declared-but-empty `commands: {}`
# still gets a pre-push hook file. That file would spawn a process on every
# push, in a worktree with no reachable binary. It would print `Can't find
# lefthook in PATH`, for a group that runs nothing.
#
# If you remove the key, that does not retroactively delete a pre-push hook
# file a prior install already wrote. `pnpm exec lefthook uninstall` (then
# reinstall) clears one left over from an earlier revision of this file. CI
# is the enforcement boundary (ADR 002). The vitest suite needs tooling that
# a fresh clone or worktree may not have yet. A slow pre-push hook would
# train people straight to `--no-verify`, which this repository forbids
# outright. This is why #120 removes `.pre-commit-config.yaml`'s local
# hooks, rather than move them to a pre-push stage.
#
# Bypass for one commit or push with --no-verify. CI enforces regardless.

pre-commit:
  commands:
    # Biome over the staged files only. `--staged` is Biome's own selection,
    # rather than a file list from lefthook. It reads the index the way the
    # CI `biome` job reads the tree. It applies `biome.json`'s exclusions
    # itself. --no-errors-on-unmatched turns "no staged file matched" into a
    # pass rather than an error, which Biome would otherwise raise.
    # `check`, never `check --write`: a hook that edits the tree commits
    # something nobody reviewed.
    biome:
      glob: '*.{json,mjs,ts}'
      run: |
        if [ -d node_modules ]; then
          pnpm exec biome check --staged --error-on-warnings --no-errors-on-unmatched
        else
          printf '\n!! pre-commit: node_modules is absent, so the biome gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   pnpm install\n\n' >&2
        fi

    # ESLint over the staged Markdown and JSON (ADR 005). `pnpm lint` passes
    # the flag that loads `eslint.config.ts` and `--max-warnings 0`.
    # `--no-warn-ignored` turns "no config matches this file" into silence,
    # since most staged Markdown and JSON is not Claude Code configuration.
    # A rule that reads a second file sees the working tree, not the index.
    # CI lints the whole tree.
    eslint:
      glob: '*.{md,json}'
      run: |
        if [ -d node_modules ]; then
          pnpm lint --no-warn-ignored {staged_files}
        else
          printf '\n!! pre-commit: node_modules is absent, so the eslint gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   pnpm install\n\n' >&2
        fi

    # The one step that is NOT staged-only (ADR 002): `tsc -p tsconfig.json`
    # checks the whole project. A type error that a staged file causes is
    # usually in a file that was not staged. `*.ts` here matches a nested
    # staged file too (no leading `**` needed), the same way the `biome` glob
    # above does.
    types:
      glob: '{*.ts,tsconfig.json}'
      run: |
        if [ -d node_modules ]; then
          pnpm exec tsc -p tsconfig.json
        else
          printf '\n!! pre-commit: node_modules is absent, so the types gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   pnpm install\n\n' >&2
        fi

    # `vitest related` resolves the module graph and runs only the tests
    # that reach a staged file. So the hook scales with the diff, rather
    # than with the repository (ADR 002). `--coverage.enabled=false`:
    # coverage thresholds mean something only when measured over the full
    # suite (SurveyMonkey/skills #219). They do not mean much over whatever
    # subset a diff happens to touch.
    #
    # `--passWithNoTests` overrides `vitest.config.ts`'s
    # `passWithNoTests: false`, for this one staged-scoped invocation only.
    # A staged file that no test reaches is not a failure in this venue.
    # This differs from the full CI run, which keeps `passWithNoTests:
    # false`. There, an empty collection is a configuration bug, not a
    # normal diff shape.
    vitest-related:
      glob: '*.ts'
      run: |
        if [ -d node_modules ]; then
          pnpm exec vitest related --run --coverage.enabled=false --passWithNoTests {staged_files}
        else
          printf '\n!! pre-commit: node_modules is absent, so the vitest-related gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   pnpm install\n\n' >&2
        fi

    # `claude plugin validate <plugin> --strict` checks that plugin's
    # manifest, and every skill under it (SKILL.md frontmatter included). So
    # this step runs on any staged path under a plugin, not only its
    # manifest, each plugin at most once. It runs
    # `claude plugin validate . --strict` when a staged path is under the
    # top level `.claude-plugin/` (the marketplace manifest). It runs
    # `claude plugin validate plugins/<p> --strict` when a staged path is
    # under `plugins/<p>/`. This needs no API key or login: validate reads
    # the manifests and skills off disk.
    plugin-validate:
      glob: '{.claude-plugin/**,plugins/*/**}'
      run: |
        if command -v claude >/dev/null 2>&1; then
          sh -c '
            set -eu
            marketplace_done=0
            plugins_done=""
            for f do
              case "$f" in
                plugins/*/*)
                  p=$(printf "%s\n" "$f" | cut -d/ -f1-2)
                  case " $plugins_done " in
                    *" $p "*) ;;
                    *)
                      claude plugin validate "$p" --strict
                      plugins_done="$plugins_done $p"
                      ;;
                  esac
                  ;;
                .claude-plugin/*)
                  if [ "$marketplace_done" -eq 0 ]; then
                    claude plugin validate . --strict
                    marketplace_done=1
                  fi
                  ;;
              esac
            done
          ' sh {staged_files}
        else
          printf '\n!! pre-commit: claude (the Claude Code CLI) is not installed, so the plugin-validate gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   curl -fsSL https://claude.ai/install.sh | bash\n\n' >&2
        fi
