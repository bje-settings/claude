# lefthook.yml: local git hooks, staged-only and fast (ADR 002, #120 replaces
# the pre-commit framework with this). Installed by `pnpm install` (lefthook's
# own postinstall runs `lefthook install`, via `pnpm.onlyBuiltDependencies` in
# package.json, since pnpm 10 blocks a dependency's lifecycle scripts
# otherwise) or by hand with `pnpm exec lefthook install`.
#
# lefthook resolves the hooks directory with `git rev-parse --git-path hooks`,
# the clone's common dir, so a `pnpm install` from any worktree of this clone
# installs the hook for every worktree of it. Each step below still needs its
# own checkout's `node_modules` (or `.venv`, for the ruff steps): a worktree
# that has not run its own `pnpm install` yet finds no lefthook binary in its
# `node_modules`, the installed hook script prints `Can't find lefthook in
# PATH` and returns 0, and the commit goes through unchecked; it gains the
# hooks the moment that worktree runs its own `pnpm install`.
#
# pre-commit runs only the gates that are staged-scoped and stay fast: Biome
# over the staged JSON, .mjs and .ts; `vitest related` over the tests the
# staged files reach; `claude plugin validate --strict` when a manifest is
# staged; and, for as long as Python is in the tree (#138 retires it), ruff
# (check and format --check) over staged Python. `tsc -p` is the one step
# that is NOT staged-only: it type-checks the whole project, because a type
# error caused by a staged file is usually in a file that was not staged, and
# a project-wide checker handed a file list answers a different question. The
# glob decides when the step runs, not what it checks. None of these runs a
# suite; that is stated as a rule in ADR 002, not a budget, because a hook
# that runs everything gets slower as the repository grows and the response
# is always to disable it.
#
# pre-push runs nothing. CI is the enforcement boundary (ADR 002): the pytest
# and vitest suites need tooling a fresh clone or worktree may not have yet,
# and a slow pre-push hook trains people straight to --no-verify, which this
# repository forbids outright. This is why #120 removes
# .pre-commit-config.yaml's local hooks rather than porting them to a
# pre-push stage.
#
# Bypass for one commit or push with --no-verify. CI enforces regardless.

pre-commit:
  commands:
    # Biome over the staged files only. `--staged` is Biome's own selection
    # rather than a file list from lefthook: it reads the index the way the
    # CI `biome` job reads the tree, and it applies biome.json's exclusions
    # itself. --no-errors-on-unmatched turns "no staged file matched" into a
    # pass rather than an error, which Biome would otherwise raise.
    # `check`, never `check --write`: a hook that edits the tree commits
    # something nobody reviewed.
    biome:
      glob: '*.{json,mjs,ts}'
      run: |
        if [ -d node_modules ]; then
          pnpm exec biome check --staged --error-on-warnings --no-errors-on-unmatched
        else
          printf '\n!! pre-commit: node_modules is absent, so the biome gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   pnpm install\n\n' >&2
        fi

    # The one step that is NOT staged-only (ADR 002): `tsc -p tsconfig.json`
    # checks the whole project, because a type error caused by a staged file
    # is usually in a file that was not staged. `*.ts` here matches a nested
    # staged file too (no leading `**` needed), the same way the `biome` glob
    # above does.
    types:
      glob: '{*.ts,tsconfig.json}'
      run: |
        if [ -d node_modules ]; then
          pnpm exec tsc -p tsconfig.json
        else
          printf '\n!! pre-commit: node_modules is absent, so the types gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   pnpm install\n\n' >&2
        fi

    # `vitest related` resolves the module graph and runs only the tests that
    # reach a staged file, so the hook scales with the diff rather than with
    # the repository (ADR 002). --coverage.enabled=false: coverage thresholds
    # mean something only measured over the full suite (SurveyMonkey/skills
    # #219), not over whatever subset a diff happens to touch.
    # --passWithNoTests overrides vitest.config.ts's `passWithNoTests: false`
    # for this one staged-scoped invocation only: a staged file no test
    # reaches is not a failure in this venue, unlike the full CI run, which
    # keeps passWithNoTests: false because collecting nothing there is a
    # configuration bug, not a normal diff shape.
    vitest-related:
      glob: '*.ts'
      run: |
        if [ -d node_modules ]; then
          pnpm exec vitest related --run --coverage.enabled=false --passWithNoTests {staged_files}
        else
          printf '\n!! pre-commit: node_modules is absent, so the vitest-related gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   pnpm install\n\n' >&2
        fi

    # Validates only the manifest(s) actually staged, each at most once:
    # `claude plugin validate . --strict` when a staged path is under the top
    # level `.claude-plugin/` (the marketplace manifest), and
    # `claude plugin validate plugins/<p> --strict` when a staged path is
    # under `plugins/<p>/.claude-plugin/`. Needs no API key or login: validate
    # reads the manifests off disk.
    plugin-validate:
      glob: '{.claude-plugin/**,plugins/*/.claude-plugin/**}'
      run: |
        if command -v claude >/dev/null 2>&1; then
          sh -c '
            set -eu
            marketplace_done=0
            plugins_done=""
            for f do
              case "$f" in
                plugins/*/.claude-plugin/*)
                  p=$(printf "%s\n" "$f" | cut -d/ -f1-2)
                  case " $plugins_done " in
                    *" $p "*) ;;
                    *)
                      claude plugin validate "$p" --strict
                      plugins_done="$plugins_done $p"
                      ;;
                  esac
                  ;;
                .claude-plugin/*)
                  if [ "$marketplace_done" -eq 0 ]; then
                    claude plugin validate . --strict
                    marketplace_done=1
                  fi
                  ;;
              esac
            done
          ' sh {staged_files}
        else
          printf '\n!! pre-commit: claude (the Claude Code CLI) is not installed, so the plugin-validate gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   curl -fsSL https://claude.ai/install.sh | bash\n\n' >&2
        fi

    # ruff, run exactly as the `ruff` CI job runs it (check, then format
    # --check), scoped to the staged Python only. `tests/*/bin/gh` is the one
    # non-`.py` file pyproject.toml's `extend-include` names, so it is the
    # one non-`.py` glob entry here too. For as long as Python is in this
    # tree (#138 retires it with the rest of the toolchain).
    ruff-check:
      glob: '{*.py,tests/*/bin/gh}'
      run: |
        if command -v uv >/dev/null 2>&1; then
          uv run --locked ruff check {staged_files}
        else
          printf '\n!! pre-commit: uv is not installed, so the ruff-check gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   curl -LsSf https://astral.sh/uv/install.sh | sh\n\n' >&2
        fi

    ruff-format:
      glob: '{*.py,tests/*/bin/gh}'
      run: |
        if command -v uv >/dev/null 2>&1; then
          uv run --locked ruff format --check {staged_files}
        else
          printf '\n!! pre-commit: uv is not installed, so the ruff-format gate did not run here.\n' >&2
          printf '!! CI enforces it on the pull request. Install locally with:\n!!   curl -LsSf https://astral.sh/uv/install.sh | sh\n\n' >&2
        fi

pre-push:
  # Deliberately empty. See the file header: no suite runs on push, CI
  # enforces everything, and a hook that pays for a suite trains people to
  # --no-verify.
  commands: {}
