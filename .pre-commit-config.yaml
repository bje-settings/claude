# Pre-commit gates. Opt in once per clone, from the root checkout, not per
# worktree: this writes one hook into the clone's shared .git/hooks/, which
# every worktree of the clone already shares.
#
#   uv sync --locked && uv run --locked pre-commit install --allow-missing-config
#
# The hook records the .venv python of the checkout that ran the install. If
# that checkout is removed, the hook falls back to a `pre-commit` on PATH and
# commits fail outright if there is none; re-run the install from a surviving
# checkout to fix it.
#
# Every hook is `repo: local` on purpose. Each tool already has one source of
# truth: uv.lock for ruff and pytest, the contributor's PATH for claude. A PATH
# binary is not a pin; mirroring versions into `rev:` fields here would add a
# second source of truth and let the hook pass on a version CI never runs.
#
# These hooks are a convenience, not the enforcement layer: a clone that never
# runs `pre-commit install` still has to get past CI, which runs the same checks.
repos:
  - repo: local
    hooks:
      # ruff, run exactly as the `ruff` CI job runs it, including --check on the
      # formatter: a hook that reformats behind you passes locally and then fails
      # in CI on the file you did not look at.
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        pass_filenames: false
        args: ["."]
        always_run: true

      - id: ruff-format
        name: ruff format --check
        entry: uv run --locked ruff format --check
        language: system
        pass_filenames: false
        args: ["."]
        always_run: true

      # The Python suite minus the examples marked `slow`. The marker means "needs
      # pnpm, yarn or npm installed", not "slowest": the five of them run about
      # three seconds each, which several ordinary sync examples also do, and
      # under -n auto deselecting them takes the run from about 45 seconds to
      # about 44. So a commit still waits the better part of a minute here; what
      # the marker buys is that a machine without a package manager gets the same
      # result. CI runs the whole suite, and nothing is only ever checked here.
      # -x stops at the first failure so the message you get is the failure
      # itself. If the wait grows further, scope it to tests/<plugin>/ for the
      # plugins whose files changed and leave the full run to CI.
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -n auto -x -q -m "not slow"
        language: system
        pass_filenames: false
        always_run: true

      # Manifest validation, the same commands the plugin-validate workflow runs,
      # including shopt -s nullglob and the found counter. Kept identical on
      # purpose: CONTRIBUTING.md tells contributors this hook runs what CI runs,
      # and a hook that diverged would pass locally and fail in CI. See the
      # comment in .github/workflows/plugin-validate.yml for why an empty
      # plugins/ has to fail rather than pass quietly.
      # Needs no API key or login: validate reads the manifests off disk.
      - id: plugin-validate
        name: claude plugin validate --strict
        entry: bash -c 'set -euo pipefail; shopt -s nullglob; claude plugin validate . --strict; found=0; for p in plugins/*/; do claude plugin validate "$p" --strict; found=$((found + 1)); done; if [ "$found" -eq 0 ]; then echo "No plugin directories found under plugins/" >&2; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
