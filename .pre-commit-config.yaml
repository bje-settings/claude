# Pre-commit gates. Opt in per clone and per worktree:
#
#   uv sync --locked && uv run pre-commit install
#
# Every hook is `repo: local` on purpose. The tools are already pinned once, in
# uv.lock (ruff, pytest) or on the contributor's PATH (claude, shellcheck);
# mirroring those pins into `rev:` fields here would give the repo two sources of
# truth and let the hook pass on a version CI never runs.
#
# These hooks are a convenience, not the enforcement layer: a clone that never
# runs `pre-commit install` still has to get past CI, which runs the same checks.
repos:
  - repo: local
    hooks:
      # ruff, run exactly as the `ruff` CI job runs it, including --check on the
      # formatter: a hook that reformats behind you passes locally and then fails
      # in CI on the file you did not look at.
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        pass_filenames: false
        args: ["."]
        files: \.py$

      - id: ruff-format
        name: ruff format --check
        entry: uv run --locked ruff format --check
        language: system
        pass_filenames: false
        args: ["."]
        files: \.py$

      # The whole Python suite, not a scoped subset: it finishes in about two
      # seconds with -n auto, which is cheap enough to pay on every commit. -x
      # stops at the first failure so the message you get is the failure itself.
      # If it ever grows past a few seconds, scope it to tests/<plugin>/ for the
      # plugins whose files changed and leave the full run to CI.
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -n auto -x -q
        language: system
        pass_filenames: false
        always_run: true

      # Manifest validation, the same two commands the plugin-validate workflow
      # runs. Needs no API key or login: validate reads the manifests off disk.
      - id: plugin-validate
        name: claude plugin validate --strict
        entry: bash -c 'set -euo pipefail; claude plugin validate . --strict; for p in plugins/*/; do claude plugin validate "$p" --strict; done'
        language: system
        pass_filenames: false
        files: ^(\.claude-plugin/|plugins/)

      # The same file list as the `shellcheck` job in ci.yml; keep the two in
      # step. Issue #61 removes this hook along with the last .sh file under
      # plugins/.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -S warning
        language: system
        pass_filenames: false
        files: (\.sh$|/bin/gh$)
        args:
          - plugins/gh/scripts/gh-sync.sh
          - plugins/gh/scripts/gh-sync-repo.sh
          - plugins/gh/scripts/lib/discover.sh
          - plugins/gh/scripts/lib/shepherd.sh
          - plugins/gh/scripts/gh-shepherd-status.sh
          - plugins/gh/scripts/gh-shepherd-pr.sh
          - plugins/gh/hooks/session-start.sh
          - fixtures/gh/fixtures.sh
          - fixtures/gh/bin/gh
          - plugins/workstreams/scripts/ws-preflight.sh
          - plugins/workstreams/scripts/ws-issues.sh
          - plugins/workstreams/scripts/ws-state.sh
          - plugins/workstreams/scripts/ws-pr-status.sh
          - fixtures/workstreams/fixtures.sh
          - fixtures/workstreams/bin/gh
          - plugins/field-test/scripts/ft-run.sh
          - plugins/field-test/scripts/ft-resolve.sh
          - plugins/field-test/scripts/ft-collect.sh
          - plugins/field-test/scripts/ft-enterprise.sh
          - plugins/field-test/scripts/ft-redact.sh
          - plugins/field-test/scripts/ft-issue.sh
          - plugins/field-test/scripts/ft-preflight.sh
          - plugins/field-test/scripts/ft-harden-state.sh
          - plugins/field-test/scripts/ft-verify-report.sh
          - plugins/field-test/scripts/ft-wait-pr.sh
          - plugins/field-test/hooks/ft-hook.sh
          - fixtures/field-test/fixtures.sh
          - fixtures/field-test/bin/gh
          - spec/run.sh
